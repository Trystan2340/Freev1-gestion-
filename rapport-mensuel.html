<!DOCTYPE html>
<html lang="fr" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freev — Rapport Mensuel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== THEMES ===== */
    :root {
      --brand:#3b82f6; --brand-dark:#1d4ed8; --mark-bg:rgba(59,130,246,.15);
      --sb-from:#0f172a; --sb-to:#1e293b;
      --rh-from:#0f172a; --rh-mid:#1e3a5f; --rh-to:#1d4ed8;
      --emerald:#10b981; --rose:#f43f5e; --amber:#f59e0b; --violet:#8b5cf6;
      --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;
      --s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--s900:#0f172a;
      --r:14px;--rsm:8px;
    }
    [data-theme="green"]  { --brand:#10b981;--brand-dark:#059669;--mark-bg:rgba(16,185,129,.15);--sb-from:#052e16;--sb-to:#064e3b;--rh-from:#052e16;--rh-mid:#065f46;--rh-to:#059669; }
    [data-theme="amber"]  { --brand:#f59e0b;--brand-dark:#d97706;--mark-bg:rgba(245,158,11,.15);--sb-from:#1c1008;--sb-to:#2d1b05;--rh-from:#1c1008;--rh-mid:#431407;--rh-to:#b45309; }
    [data-theme="rose"]   { --brand:#f43f5e;--brand-dark:#e11d48;--mark-bg:rgba(244,63,94,.15);--sb-from:#1a0510;--sb-to:#330a1a;--rh-from:#1a0510;--rh-mid:#4c0519;--rh-to:#be123c; }
    [data-theme="violet"] { --brand:#8b5cf6;--brand-dark:#7c3aed;--mark-bg:rgba(139,92,246,.15);--sb-from:#1e1b4b;--sb-to:#2e1065;--rh-from:#1e1b4b;--rh-mid:#3b0764;--rh-to:#7c3aed; }

    body { font-family:'Inter',-apple-system,sans-serif; background:var(--s100); color:var(--s700); font-size:14px; line-height:1.6; }

    /* Smooth theme transitions */
    .sidebar,.btn-gen,.rh,.strip { transition:background .35s; }
    .rpill.active,.theme-sw { transition:all .2s; }

    /* LAYOUT */
    .app { display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:290px; flex-shrink:0; background:linear-gradient(180deg,var(--sb-from) 0%,var(--sb-to) 100%); overflow-y:auto; padding:1.1rem; display:flex; flex-direction:column; gap:.85rem; }
    .main { flex:1; overflow-y:auto; padding:1.75rem; }

    /* SIDEBAR */
    .sb-logo { display:flex; align-items:center; gap:.6rem; font-weight:800; font-size:.95rem; color:white; text-decoration:none; letter-spacing:-.4px; padding-bottom:.9rem; border-bottom:1px solid rgba(255,255,255,.08); }
    .sb-logo em { color:var(--brand); font-style:normal; }
    .sb-logo small { color:rgba(255,255,255,.35); font-weight:400; font-size:.65rem; display:block; margin-top:-3px; }
    .sb-sec { display:flex; flex-direction:column; gap:.4rem; }
    .sb-lbl { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:rgba(255,255,255,.3); margin-bottom:.1rem; }
    .ci,.cs { width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:var(--rsm); color:white; font-family:inherit; font-size:.82rem; font-weight:500; padding:.48rem .7rem; outline:none; transition:border-color .2s; }
    .ci:focus,.cs:focus { border-color:var(--brand); }
    .cs option { background:#1e293b; }
    .divider { height:1px; background:rgba(255,255,255,.07); }
    .check-row { display:flex; align-items:center; gap:.55rem; cursor:pointer; padding:.35rem .55rem; border-radius:var(--rsm); transition:background .15s; }
    .check-row:hover { background:rgba(255,255,255,.05); }
    .check-row input[type=checkbox] { width:14px; height:14px; accent-color:var(--brand); cursor:pointer; flex-shrink:0; }
    .check-row span { font-size:.77rem; color:rgba(255,255,255,.65); font-weight:500; }
    .radio-row { display:flex; gap:.35rem; flex-wrap:wrap; }
    .rpill { flex:1; min-width:50px; padding:.38rem .45rem; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:var(--rsm); text-align:center; font-size:.68rem; font-weight:600; color:rgba(255,255,255,.45); cursor:pointer; }
    .rpill.active { background:var(--brand); border-color:var(--brand); color:white; }
    .sb-spacer { flex:1; }
    .btn-gen { width:100%; padding:.65rem; background:var(--brand); color:white; border:none; border-radius:var(--rsm); font-family:inherit; font-size:.85rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.5rem; }
    .btn-gen:hover { background:var(--brand-dark); transform:translateY(-1px); }
    .btn-back { width:100%; padding:.45rem; background:rgba(255,255,255,.06); color:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.08); border-radius:var(--rsm); font-family:inherit; font-size:.76rem; font-weight:500; cursor:pointer; text-decoration:none; text-align:center; display:block; transition:background .2s; }
    .btn-back:hover { background:rgba(255,255,255,.1); }

    /* THEME SWATCHES */
    .theme-row { display:flex; gap:.5rem; margin-top:.25rem; }
    .theme-sw { width:24px; height:24px; border-radius:50%; background:var(--tc); cursor:pointer; border:2px solid transparent; flex-shrink:0; }
    .theme-sw:hover { transform:scale(1.15); }
    .theme-sw.active { border-color:white; box-shadow:0 0 0 3px var(--tc); transform:scale(1.05); }

    /* REPORT */
    .rw { max-width:840px; margin:0 auto; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    #RC > * { animation:fadeUp .3s ease both; }
    #RC > *:nth-child(1){animation-delay:.02s}
    #RC > *:nth-child(2){animation-delay:.06s}
    #RC > *:nth-child(3){animation-delay:.09s}
    #RC > *:nth-child(4){animation-delay:.12s}
    #RC > *:nth-child(5){animation-delay:.15s}
    #RC > *:nth-child(n+6){animation-delay:.18s}

    /* HEADER */
    .rh { background:linear-gradient(135deg,var(--rh-from) 0%,var(--rh-mid) 55%,var(--rh-to) 100%); border-radius:var(--r); padding:2.25rem; margin-bottom:1.25rem; position:relative; overflow:hidden; color:white; box-shadow:0 4px 24px rgba(15,23,42,.12); }
    .rh-b1 { position:absolute; top:-60px; right:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.05); pointer-events:none; }
    .rh-b2 { position:absolute; bottom:-80px; left:40%; width:280px; height:280px; border-radius:50%; background:rgba(255,255,255,.06); pointer-events:none; }
    .rh-in { position:relative; z-index:1; }
    .rh-brand { display:flex; align-items:center; gap:.7rem; margin-bottom:1.3rem; }
    .rh-icon { width:42px; height:42px; background:rgba(255,255,255,.15); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
    .rh-bname { font-size:.95rem; font-weight:700; }
    .rh-bsub { font-size:.7rem; color:rgba(255,255,255,.5); }
    .rh-row { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:.75rem; }
    .rh-title { font-size:2rem; font-weight:800; letter-spacing:-1px; line-height:1.1; }
    .rh-sub { font-size:.82rem; color:rgba(255,255,255,.55); margin-top:.3rem; }
    .rh-meta { text-align:right; }
    .acc-chip { display:inline-flex; align-items:center; gap:.45rem; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:100px; padding:.3rem .9rem; font-size:.77rem; font-weight:600; margin-bottom:.45rem; }
    .acc-dot { width:7px; height:7px; border-radius:50%; }
    .gen-date { font-size:.67rem; color:rgba(255,255,255,.4); }

    /* KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:.75rem; margin-bottom:1.1rem; }
    .kpi { background:white; border-radius:var(--r); padding:1rem 1.15rem; box-shadow:0 1px 6px rgba(15,23,42,.07); border:1px solid var(--s200); position:relative; overflow:hidden; transition:box-shadow .2s,transform .15s; }
    .kpi:hover { box-shadow:0 4px 18px rgba(15,23,42,.1); transform:translateY(-1px); }
    .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:var(--r) var(--r) 0 0; }
    .kpi-i::before{background:var(--emerald)} .kpi-e::before{background:var(--rose)}
    .kpi-n::before{background:var(--brand)}   .kpi-b::before{background:var(--violet)}
    .kpi-s::before{background:var(--amber)}
    .kpi-lbl { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--s400); margin-bottom:.4rem; }
    .kpi-val { font-size:1.1rem; font-weight:800; letter-spacing:-.5px; line-height:1; margin-bottom:.22rem; }
    .kpi-i .kpi-val{color:var(--emerald)} .kpi-e .kpi-val{color:var(--rose)}
    .kpi-n .kpi-val{color:var(--brand)}   .kpi-n .kpi-val.neg{color:var(--rose)}
    .kpi-b .kpi-val{color:var(--violet)}  .kpi-s .kpi-val{color:var(--amber)}
    .kpi-sub { font-size:.65rem; color:var(--s400); }
    .kpi-ico { position:absolute; bottom:.7rem; right:.85rem; font-size:1.3rem; opacity:.07; }

    /* Delta chip */
    .delta { display:inline-flex; align-items:center; gap:.18rem; font-size:.58rem; font-weight:700; padding:.1rem .38rem; border-radius:100px; margin-top:.2rem; }
    .delta.up{background:#d1fae5;color:#065f46} .delta.dn{background:#ffe4e6;color:#9f1239} .delta.nt{background:var(--s100);color:var(--s500)}

    /* Compact mode */
    .compact .kpi{padding:.65rem .85rem} .compact .kpi-val{font-size:.92rem}
    .compact .sec{padding:.9rem} .compact .rh{padding:1.5rem 1.75rem}
    .compact .rh-title{font-size:1.5rem} .compact .strip{padding:.8rem 1rem}
    .compact .str-val{font-size:.88rem} .compact .kpi-grid{gap:.5rem}

    /* SECTION */
    .sec { background:white; border-radius:var(--r); padding:1.25rem; margin-bottom:1.1rem; box-shadow:0 1px 6px rgba(15,23,42,.07); border:1px solid var(--s200); }
    .sec-hd { display:flex; align-items:center; gap:.55rem; margin-bottom:1rem; flex-wrap:wrap; }
    .sec-title { font-size:.88rem; font-weight:700; color:var(--s800); letter-spacing:-.3px; flex:1; }
    .sec-badge { background:var(--s100); color:var(--s500); border-radius:100px; padding:.13rem .55rem; font-size:.65rem; font-weight:600; }
    .sec-act { display:flex; align-items:center; gap:.45rem; margin-left:auto; }

    /* TX Search & CSV */
    .tx-search { width:165px; background:var(--s100); border:1px solid var(--s200); border-radius:var(--rsm); color:var(--s700); font-family:inherit; font-size:.76rem; padding:.3rem .65rem; outline:none; transition:border-color .2s; }
    .tx-search:focus { border-color:var(--brand); background:white; }
    .btn-csv { padding:.28rem .62rem; background:white; border:1px solid var(--s200); border-radius:var(--rsm); font-family:inherit; font-size:.7rem; font-weight:600; color:var(--s600); cursor:pointer; display:flex; align-items:center; gap:.3rem; transition:all .15s; white-space:nowrap; }
    .btn-csv:hover { background:var(--s50); border-color:var(--brand); color:var(--brand); }

    /* CHARTS */
    .ch2 { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; margin-bottom:1.1rem; }
    .ch-box { height:220px; position:relative; }
    .ch-box-sm { height:185px; position:relative; }

    /* CAT list */
    .cat-list { display:flex; flex-direction:column; gap:.5rem; }
    .cat-item { display:flex; align-items:center; gap:.6rem; }
    .cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .cat-name { font-size:.76rem; font-weight:500; color:var(--s700); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cat-bw { width:65px; height:4px; background:var(--s100); border-radius:99px; overflow:hidden; flex-shrink:0; }
    .cat-b { height:100%; border-radius:99px; }
    .cat-pct { font-size:.67rem; color:var(--s400); width:26px; text-align:right; }
    .cat-val { font-size:.74rem; font-weight:600; color:var(--s700); width:88px; text-align:right; }

    /* STATS */
    .stat2 { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; margin-bottom:1.1rem; }
    .stat-row { display:flex; justify-content:space-between; align-items:center; padding:.45rem 0; border-bottom:1px solid var(--s100); }
    .stat-row:last-child { border-bottom:none; }
    .stat-k { font-size:.75rem; color:var(--s500); }
    .stat-v { font-size:.78rem; font-weight:700; color:var(--s800); }
    .stat-v.pos{color:var(--emerald)} .stat-v.neg{color:var(--rose)}

    /* STRIP */
    .strip { background:linear-gradient(135deg,var(--sb-from) 0%,var(--sb-to) 100%); border-radius:var(--r); padding:1.1rem 1.4rem; margin-bottom:1.1rem; display:grid; grid-template-columns:repeat(4,1fr); gap:.9rem; color:white; }
    .str-it { text-align:center; }
    .str-lbl { font-size:.62rem; font-weight:600; color:rgba(255,255,255,.38); text-transform:uppercase; letter-spacing:.5px; margin-bottom:.28rem; }
    .str-val { font-size:1rem; font-weight:800; letter-spacing:-.4px; }

    /* BUDGET */
    .bud-row { display:flex; align-items:center; gap:.7rem; padding:.42rem 0; border-bottom:1px solid var(--s100); }
    .bud-row:last-child { border-bottom:none; }
    .bud-cat { font-size:.76rem; font-weight:500; color:var(--s700); flex:1; }
    .bud-bw { width:90px; height:5px; background:var(--s100); border-radius:99px; overflow:hidden; }
    .bud-b { height:100%; border-radius:99px; }
    .bud-b.ok{background:var(--emerald)} .bud-b.warn{background:var(--amber)} .bud-b.over{background:var(--rose)}
    .bud-vals { font-size:.7rem; color:var(--s500); width:135px; text-align:right; }
    .bud-st { font-size:.66rem; font-weight:700; width:52px; text-align:right; }
    .bud-st.ok{color:var(--emerald)} .bud-st.warn{color:var(--amber)} .bud-st.over{color:var(--rose)}

    /* TX TABLE */
    .tx-t { width:100%; border-collapse:collapse; font-size:.79rem; }
    .tx-t thead tr { background:var(--s50); border-bottom:2px solid var(--s200); }
    .tx-t th { padding:.62rem .82rem; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--s400); text-align:left; }
    .tx-t th:last-child { text-align:right; }
    .tx-t tbody tr { border-bottom:1px solid var(--s100); }
    .tx-t tbody tr:last-child { border-bottom:none; }
    .tx-t tbody tr:hover { background:var(--s50); }
    .tx-t td { padding:.58rem .82rem; color:var(--s700); vertical-align:middle; }
    .tx-t td:last-child { text-align:right; font-weight:700; }
    .tx-date { font-size:.7rem; color:var(--s400); white-space:nowrap; }
    .tx-desc { color:var(--s800); font-weight:500; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tx-fx { font-size:.62rem; color:var(--s400); }
    .tx-cat-p { display:inline-flex; align-items:center; gap:.3rem; background:var(--s100); border-radius:100px; padding:.16rem .52rem; font-size:.64rem; font-weight:500; color:var(--s500); }
    .tx-cat-d { width:5px; height:5px; border-radius:50%; }
    .badge { display:inline-block; border-radius:6px; padding:.1rem .42rem; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
    .b-inc{background:#d1fae5;color:#065f46} .b-exp{background:#ffe4e6;color:#9f1239} .b-tr{background:#ede9fe;color:#4c1d95}
    .a-inc{color:var(--emerald)} .a-exp{color:var(--rose)} .a-tr{color:var(--violet)}
    .tx-tags { font-size:.62rem; color:var(--s400); max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    mark { background:var(--mark-bg); color:inherit; border-radius:2px; padding:0 1px; }

    /* FOOTER */
    .rfoot { text-align:center; padding-top:.85rem; font-size:.68rem; color:var(--s400); }
    .no-data { background:var(--s50); border:1px dashed var(--s300); border-radius:var(--rsm); padding:1.1rem; text-align:center; color:var(--s400); font-size:.8rem; }

    /* PRINT */
    @media print {
      body{background:white;font-size:10px}
      .sidebar{display:none!important}
      .app{display:block;height:auto;overflow:visible}
      .main{overflow:visible;padding:0}
      .rw{max-width:100%}
      .rh{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .kpi::before,.strip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .sec{box-shadow:none;border:1px solid #e2e8f0;break-inside:avoid}
      .ch2,.kpi-grid,.stat2{break-inside:avoid}
      .ch-box{height:160px!important} .ch-box-sm{height:135px!important}
      .tx-t{font-size:8px}
      @page{margin:1.1cm}
    }
  </style>
</head>
<body>
<div class="app">

<!-- ========== SIDEBAR ========== -->
<aside class="sidebar">
  <a class="sb-logo" href="index.html">💳 Freev <em>Valeur</em><small>Rapport mensuel</small></a>

  <div class="sb-sec">
    <div class="sb-lbl">Compte</div>
    <select class="cs" id="accountSel" onchange="onCtrlChange()"></select>
  </div>

  <div class="sb-sec">
    <div class="sb-lbl">Mois</div>
    <input class="ci" type="month" id="monthSel" onchange="onCtrlChange()">
  </div>

  <div class="divider"></div>

  <div class="sb-sec">
    <div class="sb-lbl">Nom du fichier PDF</div>
    <input class="ci" type="text" id="pdfName" placeholder="Freev_Rapport_2025-01">
    <label style="font-size:.63rem;color:rgba(255,255,255,.28);margin-top:-2px;">.pdf ajouté automatiquement</label>
  </div>

  <div class="divider"></div>

  <!-- 🎨 THEME DE COULEUR -->
  <div class="sb-sec">
    <div class="sb-lbl">🎨 Thème de couleur</div>
    <div class="theme-row">
      <div class="theme-sw active" data-t="blue"   onclick="setTheme(this)" style="--tc:#3b82f6" title="Océan"></div>
      <div class="theme-sw"        data-t="green"  onclick="setTheme(this)" style="--tc:#10b981" title="Émeraude"></div>
      <div class="theme-sw"        data-t="amber"  onclick="setTheme(this)" style="--tc:#f59e0b" title="Ambre"></div>
      <div class="theme-sw"        data-t="rose"   onclick="setTheme(this)" style="--tc:#f43f5e" title="Corail"></div>
      <div class="theme-sw"        data-t="violet" onclick="setTheme(this)" style="--tc:#8b5cf6" title="Violet"></div>
    </div>
  </div>

  <!-- 🗜️ DENSITÉ D'AFFICHAGE -->
  <div class="sb-sec">
    <div class="sb-lbl">🗜️ Densité d'affichage</div>
    <div class="radio-row" id="compGroup">
      <div class="rpill active" data-v="normal"  onclick="setCompact(this)">Normal</div>
      <div class="rpill"        data-v="compact" onclick="setCompact(this)">Compact</div>
    </div>
  </div>

  <!-- 📊 TYPE GRAPHIQUE CATÉGORIES -->
  <div class="sb-sec">
    <div class="sb-lbl">📊 Graphique catégories</div>
    <div class="radio-row" id="catChGroup">
      <div class="rpill active" data-v="donut" onclick="setCatChType(this)">Donut</div>
      <div class="rpill"        data-v="bar"   onclick="setCatChType(this)">Barres</div>
      <div class="rpill"        data-v="radar" onclick="setCatChType(this)">Radar</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="sb-sec">
    <div class="sb-lbl">Précision des montants</div>
    <div class="radio-row" id="precGroup">
      <div class="rpill active" data-v="2" onclick="setPrecision(this)">2 déc.</div>
      <div class="rpill"        data-v="3" onclick="setPrecision(this)">3 déc.</div>
      <div class="rpill"        data-v="0" onclick="setPrecision(this)">Entier</div>
    </div>
  </div>

  <div class="sb-sec">
    <div class="sb-lbl">Transactions affichées</div>
    <div class="radio-row" id="txLimGroup">
      <div class="rpill active" data-v="all" onclick="setTxLim(this)">Toutes</div>
      <div class="rpill"        data-v="20"  onclick="setTxLim(this)">Top 20</div>
      <div class="rpill"        data-v="10"  onclick="setTxLim(this)">Top 10</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="sb-sec">
    <div class="sb-lbl">Sections incluses</div>
    <label class="check-row"><input type="checkbox" id="o_bc"  checked onchange="render()"><span>📈 Graphique solde</span></label>
    <label class="check-row"><input type="checkbox" id="o_cc"  checked onchange="render()"><span>🥧 Graphique catégories</span></label>
    <label class="check-row"><input type="checkbox" id="o_ic"  checked onchange="render()"><span>📊 Revenus / Dépenses</span></label>
    <label class="check-row"><input type="checkbox" id="o_cd"  checked onchange="render()"><span>📋 Détail catégories</span></label>
    <label class="check-row"><input type="checkbox" id="o_st"  checked onchange="render()"><span>🔢 Statistiques avancées</span></label>
    <label class="check-row"><input type="checkbox" id="o_bu"  checked onchange="render()"><span>🎯 Analyse budget</span></label>
    <label class="check-row"><input type="checkbox" id="o_sd"  checked onchange="render()"><span>🏦 Détail épargne</span></label>
    <label class="check-row"><input type="checkbox" id="o_tx"  checked onchange="render()"><span>📄 Tableau transactions</span></label>

      Imprimer / Exporter PDF
    </button>

</aside>

<!-- ========== MAIN ========== -->
<main class="main">
  <div class="rw" id="RW">
    <div id="RC">
      <div style="text-align:center;padding:4rem;color:var(--s400);">
        <div style="font-size:2rem;margin-bottom:.5rem;">📊</div><div>Chargement…</div>
      </div>
    </div>
  </div>
</main>
</div>

<script>
// ===== CONFIG =====
const STORAGE_KEY = 'freevMultiAccounts_v2';
let allAccounts = [];
let decPrec = 2;
let txLim = 'all';
let catChType = 'donut';
let txSearch = '';

// ===== UTILS =====
const round2 = n => Math.round((Number(n)||0)*100)/100;
function fmt(n, cur='EUR') {
  return new Intl.NumberFormat('fr-FR',{style:'currency',currency:cur,minimumFractionDigits:decPrec,maximumFractionDigits:decPrec}).format(Number(n)||0);
}
function fmtPct(v,t){return t?((Math.round(v/t*1000)/10).toFixed(1).replace('.',',')+'\u202f%'):'0\u202f%';}
function isoMonth(d=new Date()){return d.toISOString().slice(0,7);}
function isoDate(d){return d.toISOString().slice(0,10);}
function frenchMonth(s){const[y,m]=s.split('-');return['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'][+m-1]+' '+y;}
function frDate(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function daysInMonth(isoM){const[y,m]=isoM.split('-').map(Number);return new Date(y,m,0).getDate();}
function prevEnd(isoM){const[y,m]=isoM.split('-').map(Number);return isoDate(new Date(y,m-1,0));}
function prevMonth(isoM){const[y,m]=isoM.split('-').map(Number);const d=new Date(y,m-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}

function deltaChip(curr, prev) {
  if(prev === 0 && curr === 0) return '';
  if(prev === 0) return `<div class="delta up">▲ nouveau</div>`;
  const pct = Math.round((curr - prev) / Math.abs(prev) * 100);
  const cls = pct > 0 ? 'up' : pct < 0 ? 'dn' : 'nt';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '—';
  return `<div class="delta ${cls}">${arrow} ${Math.abs(pct)} %</div>`;
}

// Delta inversé (pour dépenses : baisse = bien)
function deltaChipInv(curr, prev) {
  if(prev === 0 && curr === 0) return '';
  if(prev === 0) return '';
  const pct = Math.round((curr - prev) / Math.abs(prev) * 100);
  const cls = pct < 0 ? 'up' : pct > 0 ? 'dn' : 'nt';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '—';
  return `<div class="delta ${cls}">${arrow} ${Math.abs(pct)} %</div>`;
}

function hexToRgba(hex, a) {
  hex = hex.trim().replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function getBrand() {
  return getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#3b82f6';
}

function hlSearch(str) {
  if(!txSearch || !str) return str;
  const esc = txSearch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return str.replace(new RegExp(`(${esc})`,'gi'),'<mark>$1</mark>');
}

const PAL = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6','#84cc16','#6366f1','#64748b','#a16207','#0f766e','#be123c'];

// ===== DATA =====
function loadData(){
  try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');allAccounts=p.accounts||[];return allAccounts.length>0;}
  catch{return false;}
}
function gAcc(id){return allAccounts.find(a=>a.id===id);}
function gCur(id){return id==='__all__'?allAccounts[0]?.settings?.baseCurrency||'EUR':gAcc(id)?.settings?.baseCurrency||'EUR';}
function gTx(id){
  // Déduplique les occurrences récurrentes par (parentId, periodKey) au cas où
  // des doublons seraient encore présents dans les données sauvegardées.
  const raw = id==='__all__'
    ? allAccounts.flatMap(a=>a.transactions||[])
    : gAcc(id)?.transactions||[];
  const seen=new Set();
  return raw.filter(t=>{
    if(!t.parentId) return true;
    const k=`${String(t.parentId)}|${t.periodKey||t.date||''}`;
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
function gCap(id){return id==='__all__'?allAccounts.reduce((s,a)=>s+(Number(a.initialCapital)||0),0):Number(gAcc(id)?.initialCapital)||0;}
function gSavTot(id){const accs=id==='__all__'?allAccounts:[gAcc(id)].filter(Boolean);return accs.reduce((s,a)=>s+Object.values(a.savingsAccounts||{}).reduce((x,v)=>x+(Number(v)||0),0),0);}
function gSavDet(id){if(id==='__all__'){const m={};allAccounts.forEach(a=>Object.entries(a.savingsAccounts||{}).forEach(([k,v])=>{m[k]=(m[k]||0)+(Number(v)||0);}));return m;}return gAcc(id)?.savingsAccounts||{};}
function gBudgets(id){
  // index.html stores budgets as acc.budgetsByCategory = {Cat: number}
  // (not settings.budgetCategories string — that was a legacy format)
  if(id==='__all__'){
    const merged={};
    allAccounts.forEach(a=>{
      const bbc=a.budgetsByCategory||{};
      Object.entries(bbc).forEach(([k,v])=>{ if(!merged[k]) merged[k]=Number(v)||0; });
    });
    return merged;
  }
  return Object.fromEntries(
    Object.entries(gAcc(id)?.budgetsByCategory||{}).map(([k,v])=>[k,Number(v)||0])
  );
}

// ===== BALANCE =====
function balUpTo(txList,cap,cutoff){
  // txList est déjà dédupliqué (issu de gTx)
  const tx=txList.filter(t=>!t.isRecurring&&(t.date||'')<=cutoff);
  const i=tx.filter(t=>t.type==='income').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0);
  const e=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0);
  const r=tx.filter(t=>t.type==='transfer').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0);
  return round2(cap+i-e-r);
}

// ===== CONTROLS =====
function initCtrl(){
  const sel=document.getElementById('accountSel');sel.innerHTML='';
  if(allAccounts.length>1){const o=document.createElement('option');o.value='__all__';o.textContent='Tous les comptes';sel.appendChild(o);}
  allAccounts.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name||'Compte';sel.appendChild(o);});
  const p=new URLSearchParams(location.search);
  const pm=p.get('month'),pa=p.get('account');
  document.getElementById('monthSel').value=pm||isoMonth();
  if(pa&&(pa==='__all__'||allAccounts.find(a=>a.id===pa)))sel.value=pa;
  else if(allAccounts.length)sel.value=allAccounts[0].id;
  updPdfName();
}
function updPdfName(){
  const month=document.getElementById('monthSel').value||isoMonth();
  const id=document.getElementById('accountSel').value;
  const acc=id==='__all__'?null:gAcc(id);
  const slug=acc?acc.name.replace(/[^a-zA-Z0-9]/g,'_'):'Tous';
  document.getElementById('pdfName').value=`Freev_${slug}_${month}`;
}
function onCtrlChange(){updPdfName();render();}
function setPrecision(el){document.querySelectorAll('#precGroup .rpill').forEach(p=>p.classList.remove('active'));el.classList.add('active');decPrec=Number(el.dataset.v);render();}
function setTxLim(el){document.querySelectorAll('#txLimGroup .rpill').forEach(p=>p.classList.remove('active'));el.classList.add('active');txLim=el.dataset.v;render();}

function setTheme(el) {
  document.querySelectorAll('.theme-sw').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.documentElement.setAttribute('data-theme', el.dataset.t);
  // rebuild charts with new brand color
  setTimeout(()=>rebuildCharts(), 50);
}
function setCompact(el) {
  document.querySelectorAll('#compGroup .rpill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('RW').classList.toggle('compact', el.dataset.v==='compact');
}
function setCatChType(el) {
  document.querySelectorAll('#catChGroup .rpill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  catChType = el.dataset.v;
  rebuildCatChart();
}
function rebuildCharts() {
  // Re-render charts after theme change
  const id=document.getElementById('accountSel').value;
  const month=document.getElementById('monthSel').value;
  if(!month||!id) return;
  const D=compute(id,month);
  if($c('o_bc')) mkLine('ch_bal', D.daily, D.cur);
  rebuildCatChart();
  if($c('o_ic')) mkBar('ch_ine', D.income, D.expenses, D.transfers, D.cur);
}
function rebuildCatChart() {
  const id=document.getElementById('accountSel').value;
  const month=document.getElementById('monthSel').value;
  if(!month||!id||!$c('o_cc')) return;
  const D=compute(id,month);
  if(catChType==='donut') mkDonut('ch_cat',D.catBD,D.cur);
  else if(catChType==='bar') mkBarCat('ch_cat',D.catBD,D.cur);
  else mkRadar('ch_cat',D.catBD,D.cur);
}

// ===== COMPUTE =====
function compute(id, month) {
  const allTx=gTx(id), cap=gCap(id), cur=gCur(id);
  const mt=allTx.filter(t=>(t.date||'').startsWith(month)&&!t.isRecurring);
  const income  =round2(mt.filter(t=>t.type==='income')  .reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0));
  const expenses=round2(mt.filter(t=>t.type==='expense') .reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0));
  const transfers=round2(mt.filter(t=>t.type==='transfer').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0));
  const net=round2(income-expenses-transfers);
  const days=daysInMonth(month);
  const [y,m2]=month.split('-').map(Number);
  const lastDay=isoDate(new Date(y,m2,0));
  const startBal=balUpTo(allTx,cap,prevEnd(month));
  const endBal=balUpTo(allTx,cap,lastDay);
  const daily=[];for(let d=1;d<=days;d++){const ds=`${month}-${String(d).padStart(2,'0')}`;daily.push({day:d,date:ds,balance:balUpTo(allTx,cap,ds)});}
  const catMap={};mt.filter(t=>t.type==='expense').forEach(t=>{const c=t.category||'Autre';catMap[c]=(catMap[c]||0)+(Number(t.amountBase??t.amount)||0);});
  const catBD=Object.entries(catMap).map(([cat,val])=>({cat,val:round2(val)})).sort((a,b)=>b.val-a.val);
  const incMap={};mt.filter(t=>t.type==='income').forEach(t=>{const c=t.category||'Autre';incMap[c]=(incMap[c]||0)+(Number(t.amountBase??t.amount)||0);});
  const incCats=Object.entries(incMap).map(([cat,val])=>({cat,val:round2(val)})).sort((a,b)=>b.val-a.val);
  const expTx=mt.filter(t=>t.type==='expense');
  const avgExp=expTx.length?round2(expenses/expTx.length):0;
  const maxExpVal=expTx.length?Math.max(...expTx.map(t=>Number(t.amountBase??t.amount)||0)):0;
  const maxExpTx=expTx.find(t=>(Number(t.amountBase??t.amount)||0)===maxExpVal);
  const savRate=income>0?Math.round(Math.max(0,((income-expenses)/income))*1000)/10:0;
  return {cur,mt,income,expenses,transfers,net,startBal,endBal,daily,catBD,incCats,days,
    avgExp,maxExpVal,maxExpTx,dailyAvgExp:round2(expenses/days),savRate,
    savings:gSavTot(id),savDet:gSavDet(id),budgets:gBudgets(id),
    txByType:{i:mt.filter(t=>t.type==='income').length,e:mt.filter(t=>t.type==='expense').length,t:mt.filter(t=>t.type==='transfer').length}};
}

// ===== CHARTS =====
const ch = {};
function killCh(k){if(ch[k]){ch[k].destroy();delete ch[k];}}

// Plugin : texte central du donut (total dépenses)
const rptDonutCenterPlugin = {
  id: 'rptDonutCenter',
  afterDraw(chart, args, opts) {
    if (chart.config.type !== 'doughnut') return;
    const meta = chart.getDatasetMeta(0);
    if (!meta?.data?.length) return;
    const {x, y} = meta.data[0];
    const lines = opts?.lines || [];
    if (!lines.length) return;
    const {ctx} = chart;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#64748b';
    ctx.font = '600 11px Inter';
    ctx.fillText(lines[0], x, y - 12);
    ctx.fillStyle = '#0f172a';
    ctx.font = '800 14px Inter';
    ctx.fillText(lines[1], x, y + 11);
    ctx.restore();
  }
};
if (window.Chart) { try { Chart.register(rptDonutCenterPlugin); } catch(_) {} }

function mkLine(id, data, cur) {
  const el=document.getElementById(id); if(!el) return; killCh(id);
  const brand=getBrand();
  ch[id]=new Chart(el,{type:'line',data:{labels:data.map(d=>d.day),datasets:[{
    label:'Solde',data:data.map(d=>d.balance),borderColor:brand,
    backgroundColor:ctx=>{
      const g=ctx.chart.ctx.createLinearGradient(0,0,0,ctx.chart.height);
      g.addColorStop(0,hexToRgba(brand,.28));
      g.addColorStop(0.65,hexToRgba(brand,.06));
      g.addColorStop(1,hexToRgba(brand,0));
      return g;
    },
    borderWidth:2.5,
    pointRadius:2,pointHoverRadius:6,
    pointBackgroundColor:brand,
    pointHoverBackgroundColor:'white',
    pointHoverBorderColor:brand,
    pointHoverBorderWidth:2.5,
    fill:true,
    cubicInterpolationMode:'monotone'
  }]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`Solde : ${fmt(c.raw,cur)}`,title:c=>`Jour ${c[0].label}`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:10},border:{display:false}},
              y:{grid:{color:'rgba(148,163,184,.1)'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>fmt(v,cur)},border:{display:false}}}}});
}

function mkDonut(id, cats, cur) {
  const el=document.getElementById(id); if(!el||!cats.length) return; killCh(id);
  const tot=cats.reduce((s,c)=>s+c.val,0);
  ch[id]=new Chart(el,{type:'doughnut',data:{labels:cats.map(c=>c.cat),datasets:[{
    data:cats.map(c=>c.val),
    backgroundColor:cats.map((_,i)=>PAL[i%PAL.length]),
    borderWidth:3,borderColor:'white',
    hoverOffset:10,hoverBorderWidth:3}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,cutout:'68%',
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.label} : ${fmt(c.raw,cur)} (${fmtPct(c.raw,tot)})`}},
        rptDonutCenter:{lines:['Total',fmt(tot,cur)]}
      }
    }
  });
}

function mkBarCat(id, cats, cur) {
  const el=document.getElementById(id); if(!el||!cats.length) return; killCh(id);
  const top=cats.slice(0,8);
  const labels=top.map(c=>c.cat.length>18?c.cat.slice(0,17)+'…':c.cat);
  ch[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{
    data:top.map(c=>c.val),
    backgroundColor:top.map((_,i)=>PAL[i%PAL.length]),
    borderRadius:{topRight:6,bottomRight:6},
    borderSkipped:'start',
    barPercentage:0.72}]},
    options:{indexAxis:'y',animation:false,responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw,cur)}}},
      scales:{x:{grid:{color:'rgba(148,163,184,.1)'},ticks:{color:'#94a3b8',font:{size:9},callback:v=>fmt(v,cur)},border:{display:false}},
              y:{grid:{display:false},ticks:{color:'#475569',font:{size:10,weight:'500'}},border:{display:false}}}}});
}

function mkRadar(id, cats, cur) {
  const el=document.getElementById(id); if(!el||!cats.length) return; killCh(id);
  const top=cats.slice(0,8);
  const brand=getBrand();
  ch[id]=new Chart(el,{type:'radar',data:{labels:top.map(c=>c.cat.length>12?c.cat.slice(0,11)+'…':c.cat),datasets:[{
    label:'Dépenses',data:top.map(c=>c.val),
    backgroundColor:hexToRgba(brand,.18),borderColor:brand,
    pointBackgroundColor:brand,pointBorderColor:'white',pointBorderWidth:2,borderWidth:2.5,pointRadius:4,pointHoverRadius:6}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw,cur)}}},
      scales:{r:{ticks:{display:false,backdropColor:'transparent'},
                 grid:{color:'rgba(148,163,184,.2)'},
                 pointLabels:{font:{size:9,weight:'500'},color:'#475569'}}}}}  );
}

function mkBar(id, inc, exp, tr, cur) {
  const el=document.getElementById(id); if(!el) return; killCh(id);
  ch[id]=new Chart(el,{type:'bar',data:{labels:['Revenus','Dépenses','Transferts'],datasets:[{
    data:[inc,exp,tr],
    backgroundColor:['rgba(16,185,129,.82)','rgba(244,63,94,.82)','rgba(139,92,246,.82)'],
    borderColor:['#10b981','#f43f5e','#8b5cf6'],
    borderWidth:0,
    borderRadius:{topLeft:8,topRight:8},
    borderSkipped:'bottom',
    barPercentage:0.65}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw,cur)}}},
      scales:{x:{grid:{display:false},ticks:{color:'#475569',font:{size:11,weight:'600'}},border:{display:false}},
              y:{beginAtZero:true,grid:{color:'rgba(148,163,184,.1)'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>fmt(v,cur)},border:{display:false}}}}});
}

// ===== EXPORT CSV =====
function exportCSV() {
  const id=document.getElementById('accountSel').value;
  const month=document.getElementById('monthSel').value;
  if(!month||!id) return;
  const D=compute(id,month);
  const rows=[['Date','Type','Description','Catégorie','Montant','Devise']];
  [...D.mt].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(t=>{
    rows.push([
      t.date||'',
      t.type==='income'?'Revenu':t.type==='expense'?'Dépense':'Transfert',
      `"${(t.desc||t.description||'').replace(/"/g,'""')}"`,
      `"${(t.category||'Autre').replace(/"/g,'""')}"`,
      (Number(t.amountBase??t.amount)||0).toFixed(2).replace('.',','),
      D.cur
    ]);
  });
  const csv=rows.map(r=>r.join(';')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`Freev_${month}_transactions.csv`;a.click();
  URL.revokeObjectURL(url);
}

// ===== HTML HELPERS =====
function catListHTML(cats, totalForPct, cur) {
  if(!cats.length) return '<div class="no-data">Aucune donnée.</div>';
  const max=cats[0].val||1;
  return `<div class="cat-list">${cats.map((c,i)=>{
    const col=PAL[i%PAL.length];
    const pct=totalForPct>0?Math.round(c.val/totalForPct*100):0;
    const bw=Math.round(c.val/max*100);
    return `<div class="cat-item"><div class="cat-dot" style="background:${col}"></div><div class="cat-name">${c.cat}</div><div class="cat-bw"><div class="cat-b" style="width:${bw}%;background:${col}"></div></div><div class="cat-pct">${pct}%</div><div class="cat-val">${fmt(c.val,cur)}</div></div>`;
  }).join('')}</div>`;
}

// ===== RENDER =====
function render() {
  const id=document.getElementById('accountSel').value;
  const month=document.getElementById('monthSel').value;
  if(!month||!id) return;

  const acc=id==='__all__'?null:gAcc(id);
  const accName=id==='__all__'?'Tous les comptes':(acc?.name||'Compte');
  const accColor=acc?.color||'#3b82f6';
  const opts={
    bc:$c('o_bc'),cc:$c('o_cc'),ic:$c('o_ic'),cd:$c('o_cd'),st:$c('o_st'),
    bu:$c('o_bu'),sd:$c('o_sd'),tx:$c('o_tx'),tg:$c('o_tg'),cmp:$c('o_cmp')
  };

  const D=compute(id,month);
  const prevM=prevMonth(month);
  const P=opts.cmp ? compute(id, prevM) : null;

  const now=new Date();
  const genDate=now.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const sortedTx=[...D.mt].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  // Apply search filter
  const searchLow=txSearch.toLowerCase();
  const filteredTx=txSearch ? sortedTx.filter(t=>{
    const desc=(t.desc||t.description||'').toLowerCase();
    const cat=(t.category||'').toLowerCase();
    return desc.includes(searchLow)||cat.includes(searchLow);
  }) : sortedTx;
  const dispTx=txLim==='all'?filteredTx:filteredTx.slice(0,Number(txLim));

  // Save focus state
  const hadTxFocus = document.activeElement?.id==='txSearchInput';

  Object.keys(ch).forEach(killCh);

  const hasBudget=Object.keys(D.budgets).length>0;
  const hasSavDet=Object.keys(D.savDet).length>0;

  document.getElementById('RC').innerHTML = `
  <div class="rh">
    <div class="rh-b1"></div><div class="rh-b2"></div>
    <div class="rh-in">
      <div class="rh-brand">
        <div class="rh-icon">💳</div>
        <div><div class="rh-bname">Freev Valeur</div><div class="rh-bsub">Rapport financier mensuel</div></div>
      </div>
      <div class="rh-row">
        <div>
          <div class="rh-title">${frenchMonth(month)}</div>
          <div class="rh-sub">${D.mt.length} transaction${D.mt.length>1?'s':''} · ${D.cur} · ${D.days} jours${P?` · vs ${frenchMonth(prevM)}`:''}</div>
        </div>
        <div class="rh-meta">
          <div class="acc-chip"><span class="acc-dot" style="background:${accColor}"></span>${accName}</div>
          <div class="gen-date">Généré le ${genDate}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi kpi-i">
      <div class="kpi-lbl">Revenus</div>
      <div class="kpi-val">${fmt(D.income,D.cur)}</div>
      <div class="kpi-sub">${D.txByType.i} entrée${D.txByType.i>1?'s':''}</div>
      ${P ? deltaChip(D.income, P.income) : ''}
      <div class="kpi-ico">↑</div>
    </div>
    <div class="kpi kpi-e">
      <div class="kpi-lbl">Dépenses</div>
      <div class="kpi-val">${fmt(D.expenses,D.cur)}</div>
      <div class="kpi-sub">${D.txByType.e} sortie${D.txByType.e>1?'s':''}</div>
      ${P ? deltaChipInv(D.expenses, P.expenses) : ''}
      <div class="kpi-ico">↓</div>
    </div>
    <div class="kpi kpi-n">
      <div class="kpi-lbl">Résultat net</div>
      <div class="kpi-val${D.net<0?' neg':''}">${D.net>=0?'+':''}${fmt(D.net,D.cur)}</div>
      <div class="kpi-sub">${D.net>=0?'Excédent':'Déficit'}</div>
      ${P ? deltaChip(D.net, P.net) : ''}
      <div class="kpi-ico">≈</div>
    </div>
    <div class="kpi kpi-b">
      <div class="kpi-lbl">Solde fin mois</div>
      <div class="kpi-val">${fmt(D.endBal,D.cur)}</div>
      <div class="kpi-sub">Début : ${fmt(D.startBal,D.cur)}</div>
      ${P ? deltaChip(D.endBal, P.endBal) : ''}
      <div class="kpi-ico">⬤</div>
    </div>
    <div class="kpi kpi-s">
      <div class="kpi-lbl">Épargne totale</div>
      <div class="kpi-val">${fmt(D.savings,D.cur)}</div>
      <div class="kpi-sub">Transferts : ${fmt(D.transfers,D.cur)}</div>
      ${P ? deltaChip(D.savings, P.savings) : ''}
      <div class="kpi-ico">🏦</div>
    </div>
  </div>

  ${opts.bc?`<div class="sec"><div class="sec-hd"><div class="sec-title">Évolution du solde</div><span class="sec-badge">Jour par jour</span></div><div class="ch-box"><canvas id="ch_bal"></canvas></div></div>`:''}

  ${opts.cc||opts.ic?`<div class="ch2">
    ${opts.cc?`<div class="sec"><div class="sec-hd"><div class="sec-title">Répartition dépenses</div><span class="sec-badge">${D.catBD.length} catégorie${D.catBD.length>1?'s':''}</span></div><div class="ch-box-sm"><canvas id="ch_cat"></canvas></div></div>`:'<div></div>'}
    ${opts.ic?`<div class="sec"><div class="sec-hd"><div class="sec-title">Revenus · Dépenses · Transferts</div></div><div class="ch-box-sm"><canvas id="ch_ine"></canvas></div></div>`:'<div></div>'}
  </div>`:''}

  ${opts.cd||opts.st?`<div class="stat2">
    ${opts.cd?`<div class="sec">
      <div class="sec-hd"><div class="sec-title">Top catégories dépenses</div></div>
      ${catListHTML(D.catBD,D.expenses,D.cur)}
      ${D.incCats.length?`<div class="sec-hd" style="margin-top:1rem;"><div class="sec-title">Top catégories revenus</div></div>${catListHTML(D.incCats,D.income,D.cur)}`:''}
    </div>`:'<div></div>'}
    ${opts.st?`<div class="sec">
      <div class="sec-hd"><div class="sec-title">Statistiques avancées</div></div>
      <div class="stat-row"><span class="stat-k">Taux d'épargne</span><span class="stat-v ${D.savRate>=20?'pos':D.savRate<0?'neg':''}">${D.savRate.toFixed(1).replace('.',',')} %</span></div>
      <div class="stat-row"><span class="stat-k">Dépense moy. / transaction</span><span class="stat-v">${fmt(D.avgExp,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Dépense moy. / jour</span><span class="stat-v">${fmt(D.dailyAvgExp,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Plus grosse dépense</span><span class="stat-v neg">${fmt(D.maxExpVal,D.cur)}${D.maxExpTx?` <small style="font-weight:400;color:var(--s400)">(${D.maxExpTx.category||'?'})</small>`:''}</span></div>
      <div class="stat-row"><span class="stat-k">Variation du solde</span><span class="stat-v ${D.endBal>=D.startBal?'pos':'neg'}">${D.endBal>=D.startBal?'+':''}${fmt(D.endBal-D.startBal,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Solde début de mois</span><span class="stat-v">${fmt(D.startBal,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Solde fin de mois</span><span class="stat-v">${fmt(D.endBal,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Transactions (revenus)</span><span class="stat-v pos">${D.txByType.i}</span></div>
      <div class="stat-row"><span class="stat-k">Transactions (dépenses)</span><span class="stat-v neg">${D.txByType.e}</span></div>
      <div class="stat-row"><span class="stat-k">Transactions (transferts)</span><span class="stat-v">${D.txByType.t}</span></div>
      <div class="stat-row"><span class="stat-k">Catégories de dépenses</span><span class="stat-v">${D.catBD.length}</span></div>
      <div class="stat-row"><span class="stat-k">Nombre de jours</span><span class="stat-v">${D.days}</span></div>
      ${P?`
      <div class="stat-row" style="border-top:2px solid var(--s200);margin-top:.4rem;padding-top:.55rem">
        <span class="stat-k" style="font-weight:700;color:var(--s700)">↔️ vs ${frenchMonth(prevM)}</span>
      </div>
      <div class="stat-row"><span class="stat-k">Δ Revenus</span><span class="stat-v ${D.income>=P.income?'pos':'neg'}">${D.income>=P.income?'+':''}${fmt(D.income-P.income,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Δ Dépenses</span><span class="stat-v ${D.expenses<=P.expenses?'pos':'neg'}">${D.expenses>=P.expenses?'+':''}${fmt(D.expenses-P.expenses,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Δ Résultat net</span><span class="stat-v ${D.net>=P.net?'pos':'neg'}">${D.net>=P.net?'+':''}${fmt(D.net-P.net,D.cur)}</span></div>
      <div class="stat-row"><span class="stat-k">Δ Taux d'épargne</span><span class="stat-v ${D.savRate>=P.savRate?'pos':'neg'}">${D.savRate>=P.savRate?'+':''}${(D.savRate-P.savRate).toFixed(1).replace('.',',')} pts</span></div>`:''}
    </div>`:'<div></div>'}
  </div>`:''}

  ${opts.bu&&hasBudget?`<div class="sec">
    <div class="sec-hd"><div class="sec-title">Analyse des budgets</div><span class="sec-badge">${Object.keys(D.budgets).length} catégorie${Object.keys(D.budgets).length>1?'s':''}</span></div>
    ${Object.entries(D.budgets).map(([cat,budget])=>{
      const spent=D.catBD.find(c=>c.cat===cat)?.val||0;
      const pct=budget>0?Math.min(Math.round(spent/budget*100),100):0;
      const cls=spent>budget?'over':spent>budget*.8?'warn':'ok';
      return `<div class="bud-row"><div class="bud-cat">${cat}</div><div class="bud-bw"><div class="bud-b ${cls}" style="width:${pct}%"></div></div><div class="bud-vals">${fmt(spent,D.cur)} / ${fmt(budget,D.cur)}</div><div class="bud-st ${cls}">${spent>budget?'Dépassé':spent>budget*.8?'⚠ Limite':'✓ OK'}</div></div>`;
    }).join('')}
  </div>`:''}

  ${opts.sd&&hasSavDet?`<div class="sec">
    <div class="sec-hd"><div class="sec-title">Détail des livrets d'épargne</div></div>
    ${Object.entries(D.savDet).map(([n,v])=>`<div class="stat-row"><span class="stat-k">🏦 ${n}</span><span class="stat-v pos">${fmt(v,D.cur)}</span></div>`).join('')}
    <div class="stat-row" style="border-top:2px solid var(--s200);margin-top:4px;padding-top:8px;">
      <span class="stat-k" style="font-weight:700;color:var(--s700)">Total épargne</span>
      <span class="stat-v pos" style="font-size:.87rem">${fmt(D.savings,D.cur)}</span>
    </div>
  </div>`:''}

  <div class="strip">
    <div class="str-it"><div class="str-lbl">Taux d'épargne</div><div class="str-val" style="color:#10b981">${D.savRate.toFixed(1).replace('.',',')} %</div></div>
    <div class="str-it"><div class="str-lbl">Dépense / jour</div><div class="str-val" style="color:#f43f5e">${fmt(D.dailyAvgExp,D.cur)}</div></div>
    <div class="str-it"><div class="str-lbl">Transferts épargne</div><div class="str-val" style="color:#8b5cf6">${fmt(D.transfers,D.cur)}</div></div>
    <div class="str-it"><div class="str-lbl">Épargne totale</div><div class="str-val" style="color:#f59e0b">${fmt(D.savings,D.cur)}</div></div>
  </div>

  ${opts.tx?`<div class="sec">
    <div class="sec-hd">
      <div class="sec-title">Détail des transactions</div>
      <span class="sec-badge">${dispTx.length}${txSearch?` / ${filteredTx.length} filtrées`:txLim!=='all'?` / ${D.mt.length}`:''}</span>
      <div class="sec-act">
        <input class="tx-search" type="text" id="txSearchInput" placeholder="🔍 Rechercher…"
          value="${txSearch.replace(/"/g,'&quot;')}"
          oninput="txSearch=this.value;render()">
        <button class="btn-csv" onclick="exportCSV()" title="Exporter en CSV">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
      </div>
    </div>
    ${dispTx.length?`<table class="tx-t">
      <thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Catégorie</th>${opts.tg?'<th>Tags</th>':''}<th>Montant</th></tr></thead>
      <tbody>${dispTx.map(t=>{
        const amt=Number(t.amountBase??t.amount)||0;
        const aC=t.type==='income'?'a-inc':t.type==='expense'?'a-exp':'a-tr';
        const sign=t.type==='income'?'+':t.type==='transfer'?'→':'-';
        const cat=t.category||'Autre';
        const ci=D.catBD.findIndex(c=>c.cat===cat);
        const cc=PAL[ci>=0?ci%PAL.length:Math.abs(cat.charCodeAt(0)%PAL.length)];
        const fx=t.currency&&t.currency!==D.cur&&t.amount!==undefined?`<br><span class="tx-fx">${fmt(t.amount,t.currency||D.cur)} × ${t.fxRate||1}</span>`:'';
        const desc=t.desc||t.description||'—';
        return `<tr>
          <td class="tx-date">${frDate(t.date)}</td>
          <td><span class="badge ${t.type==='income'?'b-inc':t.type==='expense'?'b-exp':'b-tr'}">${t.type==='income'?'Revenu':t.type==='expense'?'Dépense':'Transfert'}</span></td>
          <td class="tx-desc" title="${desc.replace(/"/g,'&quot;')}">${hlSearch(desc)}${fx}</td>
          <td><span class="tx-cat-p"><span class="tx-cat-d" style="background:${cc}"></span>${hlSearch(cat)}</span></td>
          ${opts.tg?`<td class="tx-tags">${(t.tags||[]).join(', ')||'—'}</td>`:''}
          <td class="${aC}">${sign} ${fmt(amt,D.cur)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    ${txLim!=='all'&&filteredTx.length>dispTx.length?`<div style="text-align:center;padding:.65rem;font-size:.72rem;color:var(--s400)">${filteredTx.length-dispTx.length} transaction(s) masquée(s) — modifiez la limite à gauche.</div>`:''}`
    :`<div class="no-data">${txSearch?`Aucune transaction ne correspond à « ${txSearch} ».`:'Aucune transaction pour ce mois.'}</div>`}
  </div>`:''}

  <div class="rfoot">Rapport <strong>Freev Valeur</strong> — ${genDate}<br>Document confidentiel · Données personnelles · ${accName}</div>`;

  // Restore search input focus
  if(hadTxFocus || txSearch) {
    const si=document.getElementById('txSearchInput');
    if(si){si.focus();const l=si.value.length;si.setSelectionRange(l,l);}
  }

  setTimeout(()=>{
    if(opts.bc) mkLine('ch_bal',D.daily,D.cur);
    if(opts.cc){
      if(catChType==='donut')    mkDonut('ch_cat',D.catBD,D.cur);
      else if(catChType==='bar') mkBarCat('ch_cat',D.catBD,D.cur);
      else                       mkRadar('ch_cat',D.catBD,D.cur);
    }
    if(opts.ic) mkBar('ch_ine',D.income,D.expenses,D.transfers,D.cur);
  },60);
}

function $c(id){return document.getElementById(id).checked;}

// ===== PRINT =====
function doPrint(){
  const name=document.getElementById('pdfName').value.trim()||'Freev_Rapport';
  document.title=name;window.print();
  setTimeout(()=>{document.title='Freev — Rapport Mensuel';},3000);
}

// ===== INIT =====
function init(){
  if(!loadData()){
    document.getElementById('RC').innerHTML=`<div style="text-align:center;padding:4rem;color:var(--s400)"><div style="font-size:2rem;margin-bottom:.75rem">🔒</div><div style="font-size:1rem;font-weight:700;color:var(--s800);margin-bottom:.5rem">Aucune donnée Freev trouvée</div><div>Ouvrez ce fichier depuis le même navigateur que Freev.</div><code style="display:inline-block;margin-top:1rem;background:var(--s100);padding:4px 10px;border-radius:6px;font-size:.76rem">freevMultiAccounts_v2</code></div>`;
    return;
  }
  initCtrl();render();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
