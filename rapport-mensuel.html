<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freev — Rapport Mensuel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:#3b82f6; --brand-dark:#1d4ed8;
      --emerald:#10b981; --rose:#f43f5e; --amber:#f59e0b; --violet:#8b5cf6;
      --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;
      --s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--s900:#0f172a;
      --r:14px;--rsm:8px;
    }
    body { font-family:'Inter',-apple-system,sans-serif; background:var(--s100); color:var(--s700); font-size:14px; line-height:1.6; }

    /* LAYOUT */
    .app { display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:290px; flex-shrink:0; background:var(--s900); overflow-y:auto; padding:1.1rem; display:flex; flex-direction:column; gap:.85rem; }
    .main { flex:1; overflow-y:auto; padding:1.75rem; }

    /* SIDEBAR */
    .sb-logo { display:flex; align-items:center; gap:.6rem; font-weight:800; font-size:.95rem; color:white; text-decoration:none; letter-spacing:-.4px; padding-bottom:.9rem; border-bottom:1px solid rgba(255,255,255,.08); }
    .sb-logo em { color:var(--brand); font-style:normal; }
    .sb-logo small { color:rgba(255,255,255,.35); font-weight:400; font-size:.65rem; display:block; margin-top:-3px; }
    .sb-sec { display:flex; flex-direction:column; gap:.4rem; }
    .sb-lbl { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:rgba(255,255,255,.3); margin-bottom:.1rem; }
    .sb-ctrl { display:flex; flex-direction:column; gap:.3rem; }
    .sb-ctrl label { font-size:.7rem; font-weight:500; color:rgba(255,255,255,.55); }
    .ci, .cs {
      width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
      border-radius:var(--rsm); color:white; font-family:inherit; font-size:.82rem; font-weight:500;
      padding:.48rem .7rem; outline:none; transition:border-color .2s;
    }
    .ci:focus,.cs:focus { border-color:var(--brand); }
    .cs option { background:var(--s800); }
    .divider { height:1px; background:rgba(255,255,255,.07); }
    .check-row { display:flex; align-items:center; gap:.55rem; cursor:pointer; padding:.35rem .55rem; border-radius:var(--rsm); transition:background .15s; }
    .check-row:hover { background:rgba(255,255,255,.05); }
    .check-row input[type=checkbox] { width:14px; height:14px; accent-color:var(--brand); cursor:pointer; flex-shrink:0; }
    .check-row span { font-size:.77rem; color:rgba(255,255,255,.65); font-weight:500; }
    .radio-row { display:flex; gap:.35rem; flex-wrap:wrap; }
    .rpill { flex:1; min-width:55px; padding:.38rem .45rem; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:var(--rsm); text-align:center; font-size:.7rem; font-weight:600; color:rgba(255,255,255,.45); cursor:pointer; transition:all .15s; }
    .rpill.active { background:var(--brand); border-color:var(--brand); color:white; }
    .sb-spacer { flex:1; }
    .btn-gen { width:100%; padding:.65rem; background:var(--brand); color:white; border:none; border-radius:var(--rsm); font-family:inherit; font-size:.85rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.5rem; transition:background .2s,transform .1s; }
    .btn-gen:hover { background:var(--brand-dark); transform:translateY(-1px); }
    .btn-back { width:100%; padding:.45rem; background:rgba(255,255,255,.06); color:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.08); border-radius:var(--rsm); font-family:inherit; font-size:.76rem; font-weight:500; cursor:pointer; text-decoration:none; text-align:center; display:block; transition:background .2s; }
    .btn-back:hover { background:rgba(255,255,255,.1); }

    /* REPORT */
    .rw { max-width:840px; margin:0 auto; }

    /* Header */
    .rh { background:linear-gradient(135deg,var(--s900) 0%,#1e3a5f 55%,#1d4ed8 100%); border-radius:var(--r); padding:2.25rem; margin-bottom:1.25rem; position:relative; overflow:hidden; color:white; box-shadow:0 4px 24px rgba(15,23,42,.1); }
    .rh-b1 { position:absolute; top:-60px; right:-60px; width:220px; height:220px; border-radius:50%; background:rgba(59,130,246,.14); pointer-events:none; }
    .rh-b2 { position:absolute; bottom:-80px; left:40%; width:280px; height:280px; border-radius:50%; background:rgba(99,102,241,.1); pointer-events:none; }
    .rh-in { position:relative; z-index:1; }
    .rh-brand { display:flex; align-items:center; gap:.7rem; margin-bottom:1.3rem; }
    .rh-icon { width:42px; height:42px; background:rgba(255,255,255,.15); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
    .rh-bname { font-size:.95rem; font-weight:700; }
    .rh-bsub { font-size:.7rem; color:rgba(255,255,255,.5); }
    .rh-row { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:.75rem; }
    .rh-title { font-size:2rem; font-weight:800; letter-spacing:-1px; line-height:1.1; }
    .rh-sub { font-size:.82rem; color:rgba(255,255,255,.55); margin-top:.3rem; }
    .rh-meta { text-align:right; }
    .acc-chip { display:inline-flex; align-items:center; gap:.45rem; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:100px; padding:.3rem .9rem; font-size:.77rem; font-weight:600; margin-bottom:.45rem; }
    .acc-dot { width:7px; height:7px; border-radius:50%; }
    .gen-date { font-size:.67rem; color:rgba(255,255,255,.4); }

    /* KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:.75rem; margin-bottom:1.1rem; }
    .kpi { background:white; border-radius:var(--r); padding:1rem 1.15rem; box-shadow:0 1px 6px rgba(15,23,42,.07); border:1px solid var(--s200); position:relative; overflow:hidden; }
    .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:var(--r) var(--r) 0 0; }
    .kpi-i::before { background:var(--emerald); } .kpi-e::before { background:var(--rose); }
    .kpi-n::before { background:var(--brand); }   .kpi-b::before { background:var(--violet); }
    .kpi-s::before { background:var(--amber); }
    .kpi-lbl { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--s400); margin-bottom:.4rem; }
    .kpi-val { font-size:1.1rem; font-weight:800; letter-spacing:-.5px; line-height:1; margin-bottom:.22rem; }
    .kpi-i .kpi-val { color:var(--emerald); } .kpi-e .kpi-val { color:var(--rose); }
    .kpi-n .kpi-val { color:var(--brand); }   .kpi-n .kpi-val.neg { color:var(--rose); }
    .kpi-b .kpi-val { color:var(--violet); }  .kpi-s .kpi-val { color:var(--amber); }
    .kpi-sub { font-size:.65rem; color:var(--s400); }
    .kpi-ico { position:absolute; bottom:.7rem; right:.85rem; font-size:1.3rem; opacity:.07; }

    /* Section */
    .sec { background:white; border-radius:var(--r); padding:1.25rem; margin-bottom:1.1rem; box-shadow:0 1px 6px rgba(15,23,42,.07); border:1px solid var(--s200); }
    .sec-hd { display:flex; align-items:center; gap:.55rem; margin-bottom:1rem; }
    .sec-title { font-size:.88rem; font-weight:700; color:var(--s800); letter-spacing:-.3px; }
    .sec-badge { background:var(--s100); color:var(--s500); border-radius:100px; padding:.13rem .55rem; font-size:.65rem; font-weight:600; }

    /* Charts */
    .ch2 { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; margin-bottom:1.1rem; }
    .ch-box { height:195px; position:relative; }
    .ch-box-sm { height:155px; position:relative; }

    /* Cat list */
    .cat-list { display:flex; flex-direction:column; gap:.5rem; }
    .cat-item { display:flex; align-items:center; gap:.6rem; }
    .cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .cat-name { font-size:.76rem; font-weight:500; color:var(--s700); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cat-bw { width:65px; height:4px; background:var(--s100); border-radius:99px; overflow:hidden; flex-shrink:0; }
    .cat-b { height:100%; border-radius:99px; }
    .cat-pct { font-size:.67rem; color:var(--s400); width:26px; text-align:right; }
    .cat-val { font-size:.74rem; font-weight:600; color:var(--s700); width:88px; text-align:right; }

    /* Stats 2col */
    .stat2 { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; margin-bottom:1.1rem; }
    .stat-row { display:flex; justify-content:space-between; align-items:center; padding:.45rem 0; border-bottom:1px solid var(--s100); }
    .stat-row:last-child { border-bottom:none; }
    .stat-k { font-size:.75rem; color:var(--s500); }
    .stat-v { font-size:.78rem; font-weight:700; color:var(--s800); }
    .stat-v.pos { color:var(--emerald); } .stat-v.neg { color:var(--rose); }

    /* Summary strip */
    .strip { background:var(--s900); border-radius:var(--r); padding:1.1rem 1.4rem; margin-bottom:1.1rem; display:grid; grid-template-columns:repeat(4,1fr); gap:.9rem; color:white; }
    .str-it { text-align:center; }
    .str-lbl { font-size:.62rem; font-weight:600; color:rgba(255,255,255,.38); text-transform:uppercase; letter-spacing:.5px; margin-bottom:.28rem; }
    .str-val { font-size:1rem; font-weight:800; letter-spacing:-.4px; }

    /* Budget */
    .bud-row { display:flex; align-items:center; gap:.7rem; padding:.42rem 0; border-bottom:1px solid var(--s100); }
    .bud-row:last-child { border-bottom:none; }
    .bud-cat { font-size:.76rem; font-weight:500; color:var(--s700); flex:1; }
    .bud-bw { width:90px; height:5px; background:var(--s100); border-radius:99px; overflow:hidden; }
    .bud-b { height:100%; border-radius:99px; }
    .bud-b.ok { background:var(--emerald); } .bud-b.warn { background:var(--amber); } .bud-b.over { background:var(--rose); }
    .bud-vals { font-size:.7rem; color:var(--s500); width:135px; text-align:right; }
    .bud-st { font-size:.66rem; font-weight:700; width:52px; text-align:right; }
    .bud-st.ok { color:var(--emerald); } .bud-st.warn { color:var(--amber); } .bud-st.over { color:var(--rose); }

    /* TX table */
    .tx-t { width:100%; border-collapse:collapse; font-size:.79rem; }
    .tx-t thead tr { background:var(--s50); border-bottom:2px solid var(--s200); }
    .tx-t th { padding:.62rem .82rem; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--s400); text-align:left; }
    .tx-t th:last-child { text-align:right; }
    .tx-t tbody tr { border-bottom:1px solid var(--s100); }
    .tx-t tbody tr:last-child { border-bottom:none; }
    .tx-t tbody tr:hover { background:var(--s50); }
    .tx-t td { padding:.58rem .82rem; color:var(--s700); vertical-align:middle; }
    .tx-t td:last-child { text-align:right; font-weight:700; }
    .tx-date { font-size:.7rem; color:var(--s400); white-space:nowrap; }
    .tx-desc { color:var(--s800); font-weight:500; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tx-fx { font-size:.62rem; color:var(--s400); }
    .tx-cat-p { display:inline-flex; align-items:center; gap:.3rem; background:var(--s100); border-radius:100px; padding:.16rem .52rem; font-size:.64rem; font-weight:500; color:var(--s500); }
    .tx-cat-d { width:5px; height:5px; border-radius:50%; }
    .badge { display:inline-block; border-radius:6px; padding:.1rem .42rem; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
    .b-inc { background:#d1fae5; color:#065f46; }
    .b-exp { background:#ffe4e6; color:#9f1239; }
    .b-tr  { background:#ede9fe; color:#4c1d95; }
    .a-inc { color:var(--emerald); } .a-exp { color:var(--rose); } .a-tr { color:var(--violet); }
    .tx-tags { font-size:.62rem; color:var(--s400); max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Footer */
    .rfoot { text-align:center; padding-top:.85rem; font-size:.68rem; color:var(--s400); }
    .no-data { background:var(--s50); border:1px dashed var(--s300); border-radius:var(--rsm); padding:1.1rem; text-align:center; color:var(--s400); font-size:.8rem; }

    /* PRINT */
    @media print {
      body { background:white; font-size:10px; }
      .sidebar { display:none !important; }
      .app { display:block; height:auto; overflow:visible; }
      .main { overflow:visible; padding:0; }
      .rw { max-width:100%; }
      .rh { border-radius:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .kpi::before { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .strip { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .sec { box-shadow:none; border:1px solid #e2e8f0; break-inside:avoid; }
      .ch2,.kpi-grid,.stat2 { break-inside:avoid; }
      .ch-box { height:160px !important; } .ch-box-sm { height:135px !important; }
      .tx-t { font-size:8px; }
      @page { margin:1.1cm; }
    }
  </style>
</head>
<body>
<div class="app">

<!-- ========== SIDEBAR ========== -->
<aside class="sidebar">
  <a class="sb-logo" href="index.html">💳 Freev <em>Valeur</em><small>Rapport mensuel</small></a>

  <div class="sb-sec">
    <div class="sb-lbl">Compte</div>
    <select class="cs" id="accountSel" onchange="onCtrlChange()"></select>
  </div>

  <div class="sb-sec">
    <div class="sb-lbl">Mois</div>
    <input class="ci" type="month" id="monthSel" onchange="onCtrlChange()">
  </div>

  <div class="divider"></div>

  <div class="sb-sec">
    <div class="sb-lbl">Nom du fichier PDF</div>
    <div class="sb-ctrl">
      <input class="ci" type="text" id="pdfName" placeholder="Freev_Rapport_2025-01">
      <label style="font-size:.63rem;color:rgba(255,255,255,.28);margin-top:1px;">.pdf ajouté automatiquement</label>
    </div>
  </div>

  <div class="divider"></div>

  <div class="sb-sec">
    <div class="sb-lbl">Précision des montants</div>
    <div class="radio-row" id="precGroup">
      <div class="rpill active" data-v="2" onclick="setPrecision(this)">2 déc.</div>
      <div class="rpill" data-v="3" onclick="setPrecision(this)">3 déc.</div>
      <div class="rpill" data-v="0" onclick="setPrecision(this)">Entier</div>
    </div>
  </div>

  <div class="sb-sec">
    <div class="sb-lbl">Transactions affichées</div>
    <div class="radio-row" id="txLimGroup">
      <div class="rpill active" data-v="all" onclick="setTxLim(this)">Toutes</div>
      <div class="rpill" data-v="20" onclick="setTxLim(this)">Top 20</div>
      <div class="rpill" data-v="10" onclick="setTxLim(this)">Top 10</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="sb-sec">
    <div class="sb-lbl">Sections incluses</div>
    <label class="check-row"><input type="checkbox" id="o_bc" checked onchange="render()"><span>📈 Graphique solde</span></label>
    <label class="check-row"><input type="checkbox" id="o_cc" checked onchange="render()"><span>🥧 Graphique catégories</span></label>
    <label class="check-row"><input type="checkbox" id="o_ic" checked onchange="render()"><span>📊 Revenus / Dépenses</span></label>
    <label class="check-row"><input type="checkbox" id="o_cd" checked onchange="render()"><span>📋 Détail catégories</span></label>
    <label class="check-row"><input type="checkbox" id="o_st" checked onchange="render()"><span>🔢 Statistiques avancées</span></label>
    <label class="check-row"><input type="checkbox" id="o_bu" checked onchange="render()"><span>🎯 Analyse budget</span></label>
    <label class="check-row"><input type="checkbox" id="o_sd" checked onchange="render()"><span>🏦 Détail épargne</span></label>
    <label class="check-row"><input type="checkbox" id="o_tx" checked onchange="render()"><span>📄 Tableau transactions</span></label>
    <label class="check-row"><input type="checkbox" id="o_tg" onchange="render()"><span>🏷️ Tags dans tableau</span></label>
  </div>

  <div class="sb-spacer"></div>

  <div style="display:flex;flex-direction:column;gap:.55rem;">
    <button class="btn-gen" onclick="doPrint()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Imprimer / Exporter PDF
    </button>
    <a class="btn-back" href="index.html">← Retour à Freev</a>
  </div>
</aside>

<!-- ========== MAIN ========== -->
<main class="main">
  <div class="rw">
    <div id="RC">
      <div style="text-align:center;padding:4rem;color:var(--s400);">
        <div style="font-size:2rem;margin-bottom:.5rem;">📊</div><div>Chargement…</div>
      </div>
    </div>
  </div>
</main>
</div>

<script>
// ===== CONFIG =====
const STORAGE_KEY = 'freevMultiAccounts_v2';
let allAccounts = [];
let decPrec = 2;
let txLim = 'all';

// ===== UTILS =====
const round2 = n => Math.round((Number(n)||0)*100)/100;
function fmt(n, cur='EUR') {
  return new Intl.NumberFormat('fr-FR',{style:'currency',currency:cur,minimumFractionDigits:decPrec,maximumFractionDigits:decPrec}).format(Number(n)||0);
}
function fmtPct(v,t) { return t?((Math.round(v/t*1000)/10).toFixed(1).replace('.',',')+'\u202f%'):'0\u202f%'; }
function isoMonth(d=new Date()){return d.toISOString().slice(0,7);}
function isoDate(d){return d.toISOString().slice(0,10);}
function frenchMonth(s){const[y,m]=s.split('-');return['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'][+m-1]+' '+y;}
function frDate(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function daysInMonth(isoM){const[y,m]=isoM.split('-').map(Number);return new Date(y,m,0).getDate();}
function prevEnd(isoM){const[y,m]=isoM.split('-').map(Number);return isoDate(new Date(y,m-1,0));}

const PAL = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6','#84cc16','#6366f1','#64748b','#a16207','#0f766e','#be123c'];

// ===== DATA =====
function loadData() {
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    allAccounts = p.accounts||[];
    return allAccounts.length>0;
  } catch { return false; }
}
function gAcc(id) { return allAccounts.find(a=>a.id===id); }
function gCur(id) { return id==='__all__'?allAccounts[0]?.settings?.baseCurrency||'EUR':gAcc(id)?.settings?.baseCurrency||'EUR'; }
function gTx(id) { return id==='__all__'?allAccounts.flatMap(a=>a.transactions||[]):gAcc(id)?.transactions||[]; }
function gCap(id) { return id==='__all__'?allAccounts.reduce((s,a)=>s+(Number(a.initialCapital)||0),0):Number(gAcc(id)?.initialCapital)||0; }
function gSavTot(id) {
  const accs = id==='__all__'?allAccounts:[gAcc(id)].filter(Boolean);
  return accs.reduce((s,a)=>s+Object.values(a.savingsAccounts||{}).reduce((x,v)=>x+(Number(v)||0),0),0);
}
function gSavDet(id) {
  if(id==='__all__'){const m={};allAccounts.forEach(a=>Object.entries(a.savingsAccounts||{}).forEach(([k,v])=>{m[k]=(m[k]||0)+(Number(v)||0);}));return m;}
  return gAcc(id)?.savingsAccounts||{};
}
function gBudgets(id) {
  const raw=(id==='__all__'?allAccounts[0]:gAcc(id))?.settings?.budgetCategories||'';
  const r={};raw.split('\n').forEach(l=>{const[c,a]=l.split('=');if(c&&a)r[c.trim()]=Number(a.trim())||0;});return r;
}

// ===== BALANCE =====
function balUpTo(txList,cap,cutoff) {
  const tx=txList.filter(t=>!t.isRecurring&&(t.date||'')<=cutoff);
  const i=tx.filter(t=>t.type==='income') .reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0);
  const e=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0);
  const r=tx.filter(t=>t.type==='transfer').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0);
  return round2(cap+i-e-r);
}

// ===== INIT CONTROLS =====
function initCtrl() {
  const sel=document.getElementById('accountSel');
  sel.innerHTML='';
  if(allAccounts.length>1){const o=document.createElement('option');o.value='__all__';o.textContent='Tous les comptes';sel.appendChild(o);}
  allAccounts.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name||'Compte';sel.appendChild(o);});
  const p=new URLSearchParams(location.search);
  const pm=p.get('month'),pa=p.get('account');
  document.getElementById('monthSel').value=pm||isoMonth();
  if(pa&&(pa==='__all__'||allAccounts.find(a=>a.id===pa)))sel.value=pa;
  else if(allAccounts.length)sel.value=allAccounts[0].id;
  updPdfName();
}
function updPdfName() {
  const month=document.getElementById('monthSel').value||isoMonth();
  const id=document.getElementById('accountSel').value;
  const acc=id==='__all__'?null:gAcc(id);
  const slug=acc?acc.name.replace(/[^a-zA-Z0-9]/g,'_'):'Tous';
  document.getElementById('pdfName').value=`Freev_${slug}_${month}`;
}
function onCtrlChange(){updPdfName();render();}
function setPrecision(el){document.querySelectorAll('#precGroup .rpill').forEach(p=>p.classList.remove('active'));el.classList.add('active');decPrec=Number(el.dataset.v);render();}
function setTxLim(el){document.querySelectorAll('#txLimGroup .rpill').forEach(p=>p.classList.remove('active'));el.classList.add('active');txLim=el.dataset.v;render();}

// ===== COMPUTE =====
function compute(id,month) {
  const allTx=gTx(id), cap=gCap(id), cur=gCur(id);
  const mt=allTx.filter(t=>(t.date||'').startsWith(month)&&!t.isRecurring);
  const income  =round2(mt.filter(t=>t.type==='income')  .reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0));
  const expenses=round2(mt.filter(t=>t.type==='expense') .reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0));
  const transfers=round2(mt.filter(t=>t.type==='transfer').reduce((s,t)=>s+(Number(t.amountBase??t.amount)||0),0));
  const net=round2(income-expenses-transfers);
  const days=daysInMonth(month);
  const [y,m2]=month.split('-').map(Number);
  const lastDay=isoDate(new Date(y,m2,0));
  const startBal=balUpTo(allTx,cap,prevEnd(month));
  const endBal=balUpTo(allTx,cap,lastDay);
  const daily=[];for(let d=1;d<=days;d++){const ds=`${month}-${String(d).padStart(2,'0')}`;daily.push({day:d,date:ds,balance:balUpTo(allTx,cap,ds)});}
  const catMap={};mt.filter(t=>t.type==='expense').forEach(t=>{const c=t.category||'Autre';catMap[c]=(catMap[c]||0)+(Number(t.amountBase??t.amount)||0);});
  const catBD=Object.entries(catMap).map(([cat,val])=>({cat,val:round2(val)})).sort((a,b)=>b.val-a.val);
  const incMap={};mt.filter(t=>t.type==='income').forEach(t=>{const c=t.category||'Autre';incMap[c]=(incMap[c]||0)+(Number(t.amountBase??t.amount)||0);});
  const incCats=Object.entries(incMap).map(([cat,val])=>({cat,val:round2(val)})).sort((a,b)=>b.val-a.val);
  const expTx=mt.filter(t=>t.type==='expense');
  const avgExp=expTx.length?round2(expenses/expTx.length):0;
  const maxExpVal=expTx.length?Math.max(...expTx.map(t=>Number(t.amountBase??t.amount)||0)):0;
  const maxExpTx=expTx.find(t=>(Number(t.amountBase??t.amount)||0)===maxExpVal);
  const savRate=income>0?Math.round(Math.max(0,((income-expenses)/income))*1000)/10:0;
  return {cur,mt,income,expenses,transfers,net,startBal,endBal,daily,catBD,incCats,days,
    avgExp,maxExpVal,maxExpTx,dailyAvgExp:round2(expenses/days),savRate,
    savings:gSavTot(id),savDet:gSavDet(id),budgets:gBudgets(id),
    txByType:{i:mt.filter(t=>t.type==='income').length,e:mt.filter(t=>t.type==='expense').length,t:mt.filter(t=>t.type==='transfer').length}};
}

// ===== CHARTS =====
const ch={};
function killCh(k){if(ch[k]){ch[k].destroy();delete ch[k];}}
function mkLine(id,data,cur){
  const el=document.getElementById(id);if(!el)return;killCh(id);
  ch[id]=new Chart(el,{type:'line',data:{labels:data.map(d=>d.day),datasets:[{label:'Solde',data:data.map(d=>d.balance),borderColor:'#3b82f6',backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,ctx.chart.height);g.addColorStop(0,'rgba(59,130,246,.2)');g.addColorStop(1,'rgba(59,130,246,.01)');return g;},borderWidth:2.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:'#3b82f6',fill:true,tension:0.4}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`Solde : ${fmt(c.raw,cur)}`,title:c=>`Jour ${c[0].label}`}}},
    scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:10},border:{display:false}},y:{grid:{color:'rgba(148,163,184,.15)'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>fmt(v,cur)},border:{display:false}}}}});
}
function mkDonut(id,cats,cur){
  const el=document.getElementById(id);if(!el||!cats.length)return;killCh(id);
  const tot=cats.reduce((s,c)=>s+c.val,0);
  ch[id]=new Chart(el,{type:'doughnut',data:{labels:cats.map(c=>c.cat),datasets:[{data:cats.map(c=>c.val),backgroundColor:cats.map((_,i)=>PAL[i%PAL.length]),borderWidth:2,borderColor:'white',hoverOffset:6}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label} : ${fmt(c.raw,cur)} (${fmtPct(c.raw,tot)})`}}}}});
}
function mkBar(id,inc,exp,tr,cur){
  const el=document.getElementById(id);if(!el)return;killCh(id);
  ch[id]=new Chart(el,{type:'bar',data:{labels:['Revenus','Dépenses','Transferts'],datasets:[{data:[inc,exp,tr],backgroundColor:['rgba(16,185,129,.85)','rgba(244,63,94,.85)','rgba(139,92,246,.85)'],borderRadius:8,borderSkipped:false}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw,cur)}}},
    scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:11}},border:{display:false}},y:{grid:{color:'rgba(148,163,184,.15)'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>fmt(v,cur)},border:{display:false}}}}});
}

// ===== HTML HELPERS =====
function catListHTML(cats, totalForPct, cur) {
  if(!cats.length) return '<div class="no-data">Aucune donnée.</div>';
  const max=cats[0].val||1;
  return `<div class="cat-list">${cats.map((c,i)=>{
    const col=PAL[i%PAL.length];
    const pct=totalForPct>0?Math.round(c.val/totalForPct*100):0;
    const bw=Math.round(c.val/max*100);
    return `<div class="cat-item"><div class="cat-dot" style="background:${col}"></div><div class="cat-name">${c.cat}</div><div class="cat-bw"><div class="cat-b" style="width:${bw}%;background:${col}"></div></div><div class="cat-pct">${pct}%</div><div class="cat-val">${fmt(c.val,cur)}</div></div>`;
  }).join('')}</div>`;
}
